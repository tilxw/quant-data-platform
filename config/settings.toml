# 项目配置
# 选型：用 TOML 而非 YAML/JSON——Python 3.11+ 标准库 tomllib
# 原生解析（零依赖），且支持注释。

[storage]
# 数据库文件路径（相对项目根目录）
db_path = "data/quant.duckdb"

[universe]
# 股票池：沪深300成分股（架构上可扩全A）
index_code = "000300"

[ingest]
# 历史起点：约 4 年半样本，覆盖一轮牛熊，够回测又不至于拉太久（TOML 原生日期类型）
start_date = 2022-01-01
# 相邻请求间隔（秒）：礼貌抓取，降低被数据源限频的概率
# （2026-07-23 实测：突发密集请求会触发东财短时封禁，间隔宁大勿小）
request_sleep_s = 1.5
# 单只失败比例超过该值，判定本次更新整体不可信，报错停下
max_fail_ratio = 0.1

[quality]
# 单只股票缺口占比超过该值，从 INFO（停牌或缺失，仅记录）升级为 WARN
gap_warn_ratio = 0.10
# 跨源对拍：后复权日收益率相对差超过该值记为异常日
return_diff_tol = 1e-4
# 跨源对拍每次随机抽样只数（哨兵股另算，轮换覆盖全池）
sample_size = 30
# 哨兵股：每次对拍必查（高价股/常用测试股/稳定分红股各一）
sentinels = ["600519", "000001", "600036"]
